name: Update SimReel cask

# Keeps Casks/simreel.rb on the latest SimReel release.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the cask to the latest release
        run: |
          set -euo pipefail
          LATEST="$(curl -fsSL https://solankiyogesh.github.io/simreel/download/latest.json)"
          VERSION="$(echo "$LATEST" | jq -r .version)"
          SHA="$(echo "$LATEST" | jq -r .sha256)"
          test -n "$VERSION" && test -n "$SHA"
          CURRENT="$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/simreel.rb)"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Already on $VERSION"
            exit 0
          fi
          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/simreel.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "simreel ${VERSION}"
          git push
